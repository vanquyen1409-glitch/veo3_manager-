name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write   # needed by softprops/action-gh-release

jobs:
  build:
    name: Build ${{ matrix.os-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: windows-amd64
            runner: windows-latest
            artifact-glob: build/bin/*.exe
          - os-name: macos-universal
            runner: macos-14   # arm64 runner; can produce universal binaries
            artifact-glob: build/bin/*.dmg
          - os-name: linux-amd64
            runner: ubuntu-22.04
            artifact-glob: build/bin/*.AppImage

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # tag like v0.1.0 -> 0.1.0
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # ---- Linux deps (only on Linux) ----
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.0-dev upx

      # ---- Install NSIS + UPX (Windows) ----
      - name: Install NSIS + UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          choco install upx -y --no-progress

      # ---- Install create-dmg (macOS) ----
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # ---- Build ----
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/scripts/build.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash build/scripts/build-macos.sh ${{ steps.ver.outputs.version }} universal

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bash build/scripts/build-linux.sh ${{ steps.ver.outputs.version }} amd64

      # ---- Upload per-OS artifacts ----
      - uses: actions/upload-artifact@v4
        with:
          name: veo3-manager-${{ matrix.os-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -lR artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
