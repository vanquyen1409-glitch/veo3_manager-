name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  go:
    name: Go (lint + vet + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Wails uses CGO + WebKitGTK on Linux even for `go test ./...` because
      # internal/* imports the wails runtime which links against gtk symbols.
      - name: Install Linux CGO deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: go vet
        run: go vet ./...

      # golangci-lint runs ~30 linters (errcheck, govet, ineffassign, gosec,
      # staticcheck, ...) under one umbrella. Pinning the action version, not
      # the linter binary, lets dependabot upgrade us safely.
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          args: --timeout=5m

      - name: go test (with race detector)
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # eslint is best-effort: only fail CI when the lint script exists
      # in package.json. Avoids forcing every developer to wire eslint
      # before they can push.
      - name: ESLint (if configured)
        run: |
          if npm run | grep -q '^  lint$'; then
            npm run lint
          else
            echo "no 'lint' npm script defined - skipping (add 'lint' to package.json scripts to enable)"
          fi

      - name: vite build
        run: npm run build
